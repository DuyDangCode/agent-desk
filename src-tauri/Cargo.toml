[package]
name = "agent-deck"
version = "0.1.0"
description = "The Human-Centric Review Harness & Workspace for CLI Coding Agents"
authors = ["AgentDeck Team"]
license = "MIT"
repository = "https://github.com/agentdeck/agentdeck"
edition = "2021"

[lib]
name = "agent_deck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
portable-pty = "0.8"
git2 = { version = "0.19", default-features = false }
similar = { version = "2.6", features = ["inline"] }
notify = "6.1"
notify-debouncer-mini = "0.4"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
parking_lot = "0.12"
log = "0.4"
env_logger = "0.11"
dirs = "5.0"
crossbeam-channel = "0.5"
libdbus-sys = { version = "0.2", features = ["vendored"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
