<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kestrel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          const pref = localStorage.getItem('agentdeck_theme_preference');
          const isDark = !pref || pref === 'black' || pref === 'dark' || pref === 'onedark' || pref === 'dracula' || pref === 'nord' || (pref === 'system' && (!window.matchMedia || window.matchMedia('(prefers-color-scheme: dark)').matches));
          const root = document.documentElement;
          const lightVars = {
            '--deck-bg': '255 255 255',
            '--deck-surface': '248 250 252',
            '--deck-card': '241 245 249',
            '--deck-border': '226 232 240',
            '--deck-muted': '100 116 139',
            '--deck-text': '30 41 59',
            '--deck-bright': '15 23 42',
            '--deck-accent': '9 105 218',
            '--deck-accent-hover': '5 80 174',
            '--deck-success': '22 163 74',
            '--deck-danger': '225 29 72',
            '--deck-warning': '217 119 6'
          };
          const darkVars = {
            '--deck-bg': '13 17 23',
            '--deck-surface': '22 27 34',
            '--deck-card': '33 38 45',
            '--deck-border': '48 54 61',
            '--deck-muted': '139 148 158',
            '--deck-text': '201 209 217',
            '--deck-bright': '240 246 252',
            '--deck-accent': '88 166 255',
            '--deck-accent-hover': '121 192 255',
            '--deck-success': '63 185 80',
            '--deck-danger': '248 81 73',
            '--deck-warning': '210 153 34'
          };
          const activeVars = isDark ? darkVars : lightVars;
          for (const k in activeVars) {
            root.style.setProperty(k, activeVars[k]);
          }
          if (isDark) {
            root.classList.add('dark');
            root.classList.remove('light');
            root.setAttribute('data-theme', pref || 'dark');
          } else {
            root.classList.remove('dark');
            root.classList.add('light');
            root.setAttribute('data-theme', 'light');
          }
          root.style.colorScheme = isDark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-deck-bg text-deck-text overflow-hidden select-none font-sans">
    <div id="app" class="h-screen w-screen overflow-hidden"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
