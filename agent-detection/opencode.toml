[agent]
name = "opencode"
binary_names = ["opencode"]

[patterns]
# 1. Highest Priority: Requires user permission or approval
blocked = [
  "(?i)allow\\s+once",
  "(?i)always\\s+allow",
  "(?i)allow\\s+.*\\?",
  "(?i)approve",
  "(?i)permission\\s+(required|needed|request)",
  "(?i)do you want to (allow|proceed|run)",
  "(?i)\\[y/N\\]",
  "(?i)\\(y/n\\)",
  "(?i)reject"
]

# 2. Medium Priority: Agent is waiting for user prompt in TUI
idle = [
  "(?i)ask\\s+anything",
  "^opencode>\\s*$",
  "^❯\\s*$",
  "^[\\w\\-\\.]+>\\s*$"
]

# 3. Lowest Priority: Active streaming, thinking, or tool execution
working = [
  "(?i)(?:esc\\s+(?:to\\s+)?|again\\s+to\\s+)?interrupt|esc\\s+(to\\s+)?(stop|cancel)",
  "(?i)waiting\\s+for\\s+assistant",
  "(?i)sending\\s+prompt",
  "(?i)starting\\s+new\\s+session",
  "[■⬝⬥◆⬩⬪]",
  "[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏]",
  "(?i)thinking",
  "(?i)reasoning",
  "(?i)executing",
  "(?i)running\\s+(tool|command|bash|subagent)?",
  "(?i)applying\\s+patch",
  "\\d+s\\s+\\|"
]
